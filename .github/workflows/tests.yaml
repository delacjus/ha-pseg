name: Tests and Linting

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: |
          uv pip install --system "homeassistant==2026.10.2" "pytest-homeassistant-custom-component==0.13.373" "requests-mock==1.12.1" "requests==2.34.2" "beautifulsoup4==4.15.0" "ruff==0.17.1" "pytest==9.0.3"

      - name: Run Ruff
        run: |
          ruff check .

      - name: Run Pytest
        run: |
          pytest
