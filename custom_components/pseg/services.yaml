backfill_history:
  name: Backfill Energy History
  description: Fetches historical daily energy consumption and cost from the PSE&G portal and imports them into Home Assistant Long-Term Statistics.
  fields:
    start_date:
      name: Start Date
      description: The starting date to backfill from (YYYY-MM-DD). Defaults to 2 years ago if left empty.
      example: "2024-10-19"
      selector:
        date:
    end_date:
      name: End Date
      description: The ending date to backfill to (YYYY-MM-DD). Defaults to today if left empty.
      example: "2026-10-19"
      selector:
        date:
set_cost_mode:
  name: Set Cost Mode
  description: Sets the operator cost sampling mode for PSE&G real-cost evidence capture (off or evidence).
  fields:
    cost_mode:
      name: Cost Mode
      description: Cost mode to set (off or evidence; import is reserved and refused in v1.7.0).
      required: true
      example: "evidence"
      selector:
        select:
          options:
            - "off"
            - "evidence"
    entry_id:
      name: Entry ID
      description: Specific PSE&G config entry ID to configure (optional; applies to all entries if omitted).
      required: false
      example: "01M5FKK1CNKB2KAAE3C9S01AW0"
      selector:
        text:
